<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gallery — Hamdan</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Poppins',sans-serif;margin:0;background:#e6f0ff;color:#002147}
header{background:#fff;padding:12px 30px;box-shadow:0 4px 18px rgba(0,0,0,0.06);position:sticky;top:0;z-index:99}
.logo{height:56px}
.container{max-width:1100px;margin:26px auto;padding:0 18px}
h1{margin:0 0 18px}

/* Video Section - Optimized for Vertical Shorts */
.video-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 40px;
}
.video-container {
    width: 100%;
    max-width: 315px; /* Standard width for vertical shorts */
    height: 560px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    background: #000;
}

.gallery-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.gallery-container img{width:100%;height:220px;object-fit:cover;border-radius:12px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,0.08);transition:transform .25s}
.gallery-container img:hover{transform:scale(1.03)}

.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);align-items:center;justify-content:center;z-index:9999}
.lightbox img{max-width:90%;max-height:85%;border-radius:10px}
.controls{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;color:#fff;cursor:pointer;user-select:none}
.left{left:30px}.right{right:30px}
.close{position:absolute;right:30px;top:30px;font-size:34px;color:#fff;cursor:pointer}

@media (max-width:480px){
    .video-container { height: 500px; }
}
</style>
</head>
<body>
<header style="display:flex;align-items:center;justify-content:space-between">
  <img class="logo" src="https://cdn-uploads.huggingface.co/production/uploads/686dd8a37d5400c237628894/K7ARaclCg-ExIVK9xZzKl.png" alt="logo">
  <nav><a href="index.html" style="color:#003366;text-decoration:none;font-weight:700">Home</a></nav>
</header>

<div class="container">
  <h1>Entrepreneurship Center (Fashion & Design) Opening Ceremony</h1>

  <h2 style="margin-top:28px; text-align: center;">Video Highlight</h2>
  <div class="video-wrapper">
    <div class="video-container">
      <iframe 
        width="100%" 
        height="100%" 
        src="https://www.youtube.com/embed/erBoCm0tzpo" 
        title="Hamdan International Academy Launch" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <h2>Photo Gallery</h2>
  <div class="gallery-container">
    <img src="https://cdn-uploads.huggingface.co/production/uploads/686dd8a37d5400c237628894/efhNYiNz9CqRTnpWJ3KYr.png" onclick="openLB(this.src)" alt="Ribbon Cutting">
    <img src="https://cdn-uploads.huggingface.co/production/uploads/686dd8a37d5400c237628894/b-VOsabHiegeb9ZCt7Mgb.png" onclick="openLB(this.src)" alt="Fashion Lab">
    <img src="https://cdn-uploads.huggingface.co/production/uploads/686dd8a37d5400c237628894/mNsLo76YtBlsNuAnHlqlZ.png" onclick="openLB(this.src)" alt="Machines">
    <img src="https://cdn-uploads.huggingface.co/production/uploads/686dd8a37d5400c237628894/jdtsU8m-LnjoKj7UIB119.jpeg" onclick="openLB(this.src)" alt="Event">
  </div>
</div>

<div id="lightbox" class="lightbox" onclick="closeLB(event)">
  <span class="close" onclick="closeLB()">×</span>
  <span class="controls left" onclick="prevImg(event)">‹</span>
  <img id="lightbox-img" src="">
  <span class="controls right" onclick="nextImg(event)">›</span>
</div>

<script>
let imgs = Array.from(document.querySelectorAll('.gallery-container img'));
let idx = 0;
function openLB(src){
  imgs = Array.from(document.querySelectorAll('.gallery-container img'));
  idx = imgs.findIndex(i=>i.src===src);
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').style.display = 'flex';
}
function closeLB(e){
  if(e && e.target !== document.getElementById('lightbox') && e.target.className !== 'close') return;
  document.getElementById('lightbox').style.display = 'none';
}
function nextImg(e){ if(e) e.stopPropagation(); idx = (idx+1)%imgs.length; document.getElementById('lightbox-img').src = imgs[idx].src; }
function prevImg(e){ if(e) e.stopPropagation(); idx = (idx-1+imgs.length)%imgs.length; document.getElementById('lightbox-img').src = imgs[idx].src; }
document.addEventListener('keydown', (ev)=>{ if(ev.key==='ArrowRight') nextImg(); if(ev.key==='ArrowLeft') prevImg(); if(ev.key==='Escape') closeLB(); });
</script>
</body>
</html>
